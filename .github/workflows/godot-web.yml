name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export HTML5
        uses: andrewleech/godot-web-export-action@master
        with:
          godot_version: 4.7.2-stable
          export_debug: false
          export_options: export_presets.cfg

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-export/

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
